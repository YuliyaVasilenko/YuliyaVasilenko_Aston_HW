server:
  port: 8761

spring:
  application:
    name: discovery-service

eureka:
  server:
    wait-time-in-ms-when-sync-empty: 0

  instance:
    hostname: localhost
    prefer-ip-address: false


logging:
  level:
    com.netflix.eureka: WARN
    com.netflix.discovery: ERROR

management:
  endpoints:
    web:
      exposure:
        include: health, info, eureka


